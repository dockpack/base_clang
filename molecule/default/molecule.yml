---
dependency:
  name: galaxy
  role-file: requirements.yml
driver:
  name: docker
lint: |
  set -e
  yamllint .
  ANSIBLE_ROLES_PATH=${MOLECULE_EPHEMERAL_DIRECTORY}/roles ansible-lint
platforms:
  - name: base-clang-centos8
    image: quay.io/centos/centos:stream8
    privileged: true
  - name: base-clang-centos7
    image: centos:7
    privileged: true
provisioner:
  name: ansible
verifier:
  name: ansible
