---
- name: Prepare
  hosts: all
  become: true
  vars:
    role_name: "{{ lookup('env','MOLECULE_PROJECT_DIRECTORY') | basename }}"
    collections_enabled: true

  tasks:
    - name: "Include {{ role_name }}"
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop:
        - dockpack.base_cmake
        - dockpack.base_git
